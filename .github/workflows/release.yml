name: Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked --dev
      - name: Verify release identity
        run: uv run --locked python scripts/check_release.py --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
      - run: git diff --check
      - run: uv build --no-sources
      - run: uv run --locked twine check dist/*
      - run: uv run --locked python scripts/check_distribution.py --dist-dir dist
      - name: Record artifact hashes
        run: sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-bundle
      - name: Verify artifact hashes
        working-directory: release-bundle
        run: sha256sum --check SHA256SUMS
      - name: Attach distributions and hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-bundle/dist/* release-bundle/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  pypi-publish:
    needs: [build, release-assets]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kimi-bridge
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-bundle
      - name: Verify artifact hashes
        working-directory: release-bundle
        run: sha256sum --check SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-bundle/dist/
          verify-metadata: true
          attestations: true
