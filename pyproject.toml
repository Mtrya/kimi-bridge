[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kimi-bridge"
version = "0.8.0"
description = "Control a local Kimi Code agent from Feishu, QQ, Telegram, or WeChat"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mtrya" },
]
keywords = ["agent", "chatbot", "feishu", "kimi-code", "qq", "telegram", "wechat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "cryptography>=46",
    "httpx",
    "lark-oapi>=1.7.1,<2",
    "websockets",
]

[project.scripts]
kimi-bridge = "kimi_bridge.__main__:main"

[project.urls]
Homepage = "https://github.com/Mtrya/kimi-bridge"
Repository = "https://github.com/Mtrya/kimi-bridge"
Issues = "https://github.com/Mtrya/kimi-bridge/issues"
Documentation = "https://github.com/Mtrya/kimi-bridge#readme"
Changelog = "https://github.com/Mtrya/kimi-bridge/releases"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.15,<0.17",
    "twine>=6,<8",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/kimi_bridge"]

[tool.hatch.build.targets.sdist]
exclude = ["/.agents", "/references", "/roadmap"]

[tool.hatch.build.targets.wheel.force-include]
"src/kimi_bridge/assets/video-cover.png" = "kimi_bridge/assets/video-cover.png"
"src/kimi_bridge/compatibility-map.json" = "kimi_bridge/compatibility-map.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
