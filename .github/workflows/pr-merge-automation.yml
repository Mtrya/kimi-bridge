name: PR merge automation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pr-merge-automation-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  automerge-dependabot:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable squash auto-merge on Dependabot bumps
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          numbers="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            | jq -r --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '.[] | select(.state == "open" and .user.login == "dependabot[bot]" and .head.sha == $sha and .head.repo.full_name == $repo and .base.repo.full_name == $repo and .base.ref == "main") | .number')"
          if [ -z "$numbers" ]; then
            echo "No open Dependabot pull request at $HEAD_SHA"
            exit 0
          fi
          for number in $numbers; do
            enabled="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$enabled" = "true" ]; then
              echo "Pull request #$number already has auto-merge enabled"
              continue
            fi
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA"
          done

  retry-launch-failure:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'startup_failure') &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun CI when it failed before starting any job
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=1" --jq .total_count)"
          if [ "$jobs" != "0" ]; then
            echo "Run $RUN_ID reported $jobs jobs; not a launch failure"
            exit 0
          fi
          gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY"
