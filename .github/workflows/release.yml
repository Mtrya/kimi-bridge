name: Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked --dev
      - name: Verify release identity
        run: uv run --locked python scripts/check_release.py --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
      - run: git diff --check
      - run: uv build --no-sources
      - run: uv run --locked twine check dist/*
      - run: uv run --locked python scripts/check_distribution.py --dist-dir dist
      - name: Record artifact hashes
        run: sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-bundle
      - name: Verify artifact hashes
        working-directory: release-bundle
        run: sha256sum --check SHA256SUMS
      - name: Attach distributions and hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-bundle/dist/* release-bundle/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  pypi-publish:
    needs: [build, release-assets]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kimi-bridge
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-bundle
      - name: Verify artifact hashes
        working-directory: release-bundle
        run: sha256sum --check SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-bundle/dist/
          verify-metadata: true
          attestations: true
