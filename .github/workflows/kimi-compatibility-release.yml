name: Kimi compatibility release

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: kimi-compatibility-release
  cancel-in-progress: false

jobs:
  create-release:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'automation/kimi-code-compatibility' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, '<!-- kimi-bridge:compatibility-promotion -->'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --dev
      - name: Verify merged release candidate
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(uv run --locked python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; leaving it unchanged"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          promotion_commit="$(git log -S "\"bridge\": \"${version}\"" --format=%H -1 -- src/kimi_bridge/compatibility-map.json)"
          if [ -z "$promotion_commit" ]; then
            echo "No commit introduced compatibility record $version"
            exit 1
          fi
          promotion_count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$promotion_commit/pulls" --jq '[.[] | select(.merged_at != null and .head.ref == "automation/kimi-code-compatibility" and (.body | contains("<!-- kimi-bridge:compatibility-promotion -->")))] | length')"
          if [ "$promotion_count" = "0" ]; then
            echo "Compatibility record $version was prepared manually; leaving release publication to the manual release path"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$promotion_count" != "1" ]; then
            echo "Compatibility record is not owned by one merged promotion PR"
            exit 1
          fi
          release_commit="$(git rev-parse HEAD)"
          uv run --locked python scripts/check_release.py
          tag_commit=""
          tag_error="$RUNNER_TEMP/kimi-bridge-tag-ref-error"
          if remote_tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>"$tag_error")"; then
            tag_commit="$remote_tag_commit"
          elif ! grep -q "HTTP 404" "$tag_error"; then
            cat "$tag_error" >&2
            exit 1
          fi
          if [ -z "$tag_commit" ]; then
            if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$release_commit" >/dev/null; then
              tag_commit="$release_commit"
            else
              tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
            fi
          fi
          if [ "$tag_commit" != "$release_commit" ]; then
            echo "Tag $tag points to $tag_commit instead of $release_commit"
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "kimi-bridge $tag" --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: create-release
    if: needs.create-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch tag-scoped publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: gh workflow run release.yml --ref "$RELEASE_TAG" -f tag="$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
